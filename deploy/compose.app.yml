# Local integration environment. Production requires TLS and institution-approved secrets/policies.
include:
  - path: compose.yml
services:
  migrate:
    build: {context: .., dockerfile: deploy/Dockerfile}
    image: wbs-local:dev
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgres://wbs:wbs_local_only@postgres:5432/wbs
    depends_on:
      postgres: {condition: service_healthy}
  api:
    image: wbs-local:dev
    command: ["node", "apps/api/dist/apps/api/src/main.js"]
    environment: &app-env
      NODE_ENV: development
      HOST: 0.0.0.0
      DATABASE_URL: postgres://wbs:wbs_local_only@postgres:5432/wbs
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: http://localhost:8080
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: ${MINIO_REGION:-${S3_REGION:-us-east-1}}
      MINIO_BUCKET: ${MINIO_BUCKET:-${S3_BUCKET:-wbs-private}}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${S3_ACCESS_KEY:-wbs_app}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${S3_SECRET_KEY:-wbs_app_secret_local_only}}
      CLAMAV_HOST: scanner
      SMTP_HOST: mailpit
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
      storage-init: {condition: service_completed_successfully}
  worker:
    image: wbs-local:dev
    command: ["node", "apps/api/dist/apps/worker/src/main.js"]
    environment: *app-env
    depends_on: [api, scanner]
  web:
    image: wbs-local:dev
    command: ["node", "apps/web/.output/server/index.mjs"]
    environment:
      HOST: 0.0.0.0
      PORT: 3000
  proxy:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [api, web]
