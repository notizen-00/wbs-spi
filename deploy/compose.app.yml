# Local integration environment. Production requires TLS and institution-approved secrets/policies.
include:
  - path: compose.yml
x-app-build: &app-build
  context: ..
  dockerfile: deploy/Dockerfile
  args:
    NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-public.ecr.aws/docker/library/node:24-alpine}
services:
  migrate:
    build: *app-build
    pull_policy: build
    image: wbs-local:dev
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://wbs:wbs_local_only@postgres:5432/wbs}
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: *app-build
    pull_policy: build
    image: wbs-local:dev
    command: ["node", "apps/api/dist/apps/api/src/main.js"]
    environment: &app-env
      NODE_ENV: ${DOCKER_NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://wbs:wbs_local_only@postgres:5432/wbs}
      REDIS_URL: redis://redis:6379
      NOTIFICATION_REDIS_CHANNEL: ${NOTIFICATION_REDIS_CHANNEL:-wbs:notifications:v1}
      APP_ORIGIN: ${DOCKER_APP_ORIGIN:-http://localhost:${DOCKER_WEB_PORT:-8081}}
      NUXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NUXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      RECAPTCHA_ALLOWED_HOSTNAMES: ${RECAPTCHA_ALLOWED_HOSTNAMES:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: ${MINIO_REGION:-${S3_REGION:-us-east-1}}
      MINIO_BUCKET: ${MINIO_BUCKET:-${S3_BUCKET:-wbs-private}}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${S3_ACCESS_KEY:-wbs_app}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${S3_SECRET_KEY:-wbs_app_secret_local_only}}
      CLAMAV_HOST: scanner
      CLAMAV_PORT: 3310
      SMTP_HOST: ${DOCKER_SMTP_HOST:-mailpit}
      SMTP_PORT: ${DOCKER_SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-WBS UNEJ <noreply@wbs.local>}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
      storage-init: {condition: service_completed_successfully}
  worker:
    build: *app-build
    pull_policy: build
    image: wbs-local:dev
    command: ["node", "apps/api/dist/apps/worker/src/main.js"]
    environment: *app-env
    depends_on: [api, scanner]
  web:
    build: *app-build
    pull_policy: build
    image: wbs-local:dev
    command: ["node", "apps/web/.output/server/index.mjs"]
    environment:
      HOST: 0.0.0.0
      PORT: 3000
  proxy:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:${DOCKER_WEB_PORT:-8081}:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [api, web]
