services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wbs}
      POSTGRES_USER: ${POSTGRES_USER:-wbs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wbs_local_only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  minio:
    image: wbs-minio:source-2025-09-07
    build:
      context: ..
      dockerfile: deploy/minio.Dockerfile
      target: server
      args:
        GO_BASE_IMAGE: ${GO_BASE_IMAGE:-public.ecr.aws/docker/library/golang:1.24-alpine}
        ALPINE_BASE_IMAGE: ${ALPINE_BASE_IMAGE:-public.ecr.aws/docker/library/alpine:3.22}
    pull_policy: build
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wbs_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wbs_local_secret_only}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["evidence:/data"]
  storage-init:
    image: wbs-minio-mc:source-2025-08-13
    build:
      context: ..
      dockerfile: deploy/minio.Dockerfile
      target: client
      args:
        GO_BASE_IMAGE: ${GO_BASE_IMAGE:-public.ecr.aws/docker/library/golang:1.24-alpine}
        ALPINE_BASE_IMAGE: ${ALPINE_BASE_IMAGE:-public.ecr.aws/docker/library/alpine:3.22}
    pull_policy: build
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wbs_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wbs_local_secret_only}
      MINIO_BUCKET: ${MINIO_BUCKET:-${S3_BUCKET:-wbs-private}}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${S3_ACCESS_KEY:-wbs_app}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${S3_SECRET_KEY:-wbs_app_secret_local_only}}
    volumes: ["./minio-init.sh:/bootstrap/minio-init.sh:ro"]
    entrypoint: /bin/sh
    command: ["/bootstrap/minio-init.sh"]
  scanner:
    image: clamav/clamav:1.4
    ports: ["127.0.0.1:3310:3310"]
    volumes: ["clamav:/var/lib/clamav"]
volumes:
  postgres:
  evidence:
  clamav:
